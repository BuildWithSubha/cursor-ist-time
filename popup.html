<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cursor IST Time</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 280px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e8e6e3;
        background: #161412;
      }

      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 14px 14px 10px;
        border-bottom: 1px solid #2c2824;
      }

      header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      header p {
        margin: 2px 0 0;
        color: #b4aea6;
        font-size: 11px;
      }

      main {
        padding: 12px 14px 14px;
      }

      label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        margin: 2px 0 0;
        accent-color: #d97706;
      }

      .copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .copy strong {
        font-size: 13px;
        font-weight: 600;
      }

      .copy span {
        color: #b4aea6;
        font-size: 11px;
      }

      #status {
        margin: 12px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: #221f1b;
        color: #c9c3ba;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" />
      <div>
        <h1>Cursor IST Time</h1>
        <p>UTC +5:30 on cursor.com</p>
      </div>
    </header>
    <main>
      <label for="toggle">
        <input id="toggle" type="checkbox" />
        <span class="copy">
          <strong>Convert times to IST</strong>
          <span>Rewrites dashboard UTC timestamps in place.</span>
        </span>
      </label>
      <p id="status">Loading preference…</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
